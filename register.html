<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VO-AI | VO Register</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
    <header class="topbar"></header>

    <section class="welcome">
        <div>
            <h2 data-i18n="register.title">Variation Order Register</h2>
            <p data-i18n="register.sub">Every VO in this project. Click a row to open it.</p>
        </div>
    </section>

    <div class="legend-bar">
        <span class="legend-swatch"></span>
        <span id="ownedLegend"></span>
    </div>

    <div class="card">
        <div class="card-body register-filter-bar">
            <label class="register-filter-search">
                <span data-i18n="register.filter.search">Search</span>
                <input type="text" id="registerSearch" data-i18n-placeholder="register.filter.searchPlaceholder"
                       placeholder="Search VO number, description or instruction reference">
            </label>
            <label>
                <span data-i18n="register.filter.evaluateStatus">Evaluate status</span>
                <select id="registerEvalFilter">
                    <option value="all" data-i18n="register.filter.all">All</option>
                    <option value="Draft" data-i18n="status.Draft">Draft</option>
                    <option value="Pending" data-i18n="status.Pending">Pending</option>
                    <option value="Under Review" data-i18n="status.Under Review">Under Review</option>
                    <option value="Approved" data-i18n="status.Approved">Approved</option>
                    <option value="Rejected" data-i18n="status.Rejected">Rejected</option>
                </select>
            </label>
            <label>
                <span data-i18n="register.filter.certifiedStatus">Certified status</span>
                <select id="registerCertFilter">
                    <option value="all" data-i18n="register.filter.all">All</option>
                    <option value="Pending" data-i18n="status.Pending">Pending</option>
                    <option value="Approved" data-i18n="status.Approved">Approved</option>
                    <option value="Rejected" data-i18n="status.Rejected">Rejected</option>
                </select>
            </label>
            <button type="button" class="link-button" id="registerClearFilters" hidden
                    data-i18n="register.filter.clear">Clear filters</button>
            <span class="register-result-count" id="registerResultCount"></span>
        </div>
        <div class="table-scroll register-scroll">
            <table>
                <thead id="registerHead"></thead>
                <tbody id="registerBody"></tbody>
            </table>
        </div>
    </div>

    <div class="disclaimer">
        <strong data-i18n="disclaimer.title">⚠ Professional Review Required</strong>
        <span data-i18n="disclaimer.body">
            AI-generated results are decision-support outputs. Final variation assessment,
            certification and approval must be reviewed by the appropriate construction professional.
        </span>
    </div>
</main>

<script src="js/i18n.js"></script>
<script src="js/calc.js"></script>
<script src="js/clauses.js"></script>
<script src="js/elements.js"></script>
<script src="js/analysis.js"></script>
<script src="js/permissions.js"></script>
<script src="js/deadlines.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/page-register.js"></script>

</body>
</html>
