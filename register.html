<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VO-AI | VO Register</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=20261016a">
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
    <header class="topbar"></header>

    <section class="welcome">
        <div>
            <h2 data-i18n="register.title">Variation Order Register</h2>
        </div>
        <div class="page-actions" style="margin:0">
            <button type="button" class="secondary-button" id="registerExportBtn"
                    data-i18n="export.button">⬇ Export to Excel</button>
            <button class="primary-button" id="newVoBtn" data-i18n="dashboard.newVo" hidden>+ New Variation Order</button>
        </div>
    </section>

    <div class="register-layout" id="registerLayout">
        <div class="register-side">
            <div class="card tone-teal site-map-card">
                <div class="card-header">
                    <div>
                        <h3 data-i18n="map.dashTitle">Site map</h3>
                    </div>
                </div>
                <div class="card-body" id="siteMapBody"></div>
            </div>
            <div class="card register-summary-card">
                <div class="card-body stats stats-compact" id="statCards"></div>
            </div>
        </div>
        <div class="register-main">
            <div class="legend-bar">
                <span class="legend-swatch"></span>
                <span id="ownedLegend"></span>
            </div>
            <div class="card register-list-card">
                <div class="card-body register-filter-bar">
                    <label class="register-filter-search">
                        <span data-i18n="register.filter.search">Search</span>
                        <input type="text" id="registerSearch" data-i18n-placeholder="register.filter.searchPlaceholder"
                               placeholder="Search VO number, description or instruction reference">
                    </label>
                    <label>
                        <span data-i18n="register.filter.step">Stage</span>
                        <select id="registerEvalFilter">
                            <option value="all" data-i18n="register.filter.all">All</option>
                            <option value="1" data-i18n="register.stepOpt.1">1 Describe</option>
                            <option value="2" data-i18n="register.stepOpt.2">2 Contract check</option>
                            <option value="3" data-i18n="register.stepOpt.3">3 Design team</option>
                            <option value="4" data-i18n="register.stepOpt.4">4 Measure</option>
                            <option value="5" data-i18n="register.stepOpt.5">5 Consultant QS</option>
                            <option value="6" data-i18n="register.stepOpt.6">6 Client</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="register.filter.state">Status</span>
                        <select id="registerCertFilter">
                            <option value="all" data-i18n="register.filter.all">All</option>
                            <option value="draft" data-i18n="register.state.draft">Draft</option>
                            <option value="progress" data-i18n="register.state.progress">In progress</option>
                            <option value="returned" data-i18n="register.state.returned">Returned</option>
                            <option value="info" data-i18n="register.state.info">Info requested</option>
                            <option value="approved" data-i18n="register.state.approved">Approved</option>
                            <option value="rejected" data-i18n="register.state.rejected">Rejected</option>
                        </select>
                    </label>
                    <button type="button" class="link-button" id="registerClearFilters" hidden
                            data-i18n="register.filter.clear">Clear filters</button>
                    <span class="register-result-count" id="registerResultCount"></span>
                    <button type="button" class="link-button" id="registerColsBtn" aria-pressed="false" data-i18n="register.allColumns">Show all columns</button>
                </div>
                <div class="table-scroll register-scroll" data-fit data-fit-gap="20">
                    <table>
                        <thead id="registerHead"></thead>
                        <tbody id="registerBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="disclaimer">
        <strong data-i18n="disclaimer.title">⚠ Professional Review Required</strong>
        <span data-i18n="disclaimer.body">
            AI-generated results are decision-support outputs. Final variation assessment,
            certification and approval must be reviewed by the appropriate construction professional.
        </span>
    </div>
</main>

<script src="js/i18n.js?v=20261016a"></script>
<script src="js/calc.js?v=20261016a"></script>
<script src="js/clauses.js?v=20261016a"></script>
<script src="js/elements.js?v=20261016a"></script>
<script src="js/analysis.js?v=20261016a"></script>
<script src="js/permissions.js?v=20261016a"></script>
<script src="js/deadlines.js?v=20261016a"></script>
<script src="js/store.js?v=20261016a"></script>
<script src="js/config.js?v=20261016a"></script>
<script src="js/cloud.js?v=20261016a"></script>
<script src="js/ui.js?v=20261016a"></script>
<script src="js/notify.js?v=20261016a"></script>
<script src="js/filestore.js?v=20261016a"></script>
<script src="js/bqimport.js?v=20261016a"></script>
<script src="js/contractread.js?v=20261016a"></script>
<script src="js/sitemap.js?v=20261016a"></script>
<script src="js/xlsxexport.js?v=20261016a"></script>
<script src="js/page-register.js?v=20261016a"></script>

</body>
</html>
