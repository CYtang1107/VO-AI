<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VO-AI | Site record</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=20261009h">
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
    <header class="topbar"></header>

    <section class="welcome">
        <div>
            <h2 data-i18n="capture.heading">Record a variation on site</h2>
        </div>
    </section>

    <div id="captureBlocked" class="empty-state" hidden>
        <span data-i18n="capture.contractorOnly">Only the contractor records a VO on site.</span>
        <a href="dashboard.html" data-i18n="capture.backToDashboard">Back to dashboard</a>
    </div>

    <form id="captureForm" class="capture-form" novalidate hidden>
        <div class="card tone-amber">
            <div class="card-header">
                <div>
                    <h3 data-i18n="capture.step1">1 · Site photos</h3>
                </div>
                <span class="capture-count" id="photoCount"></span>
            </div>
            <div class="card-body">
                <div class="capture-shoot">
                    <label class="capture-shoot-main">
                        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
                        <span class="capture-shoot-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></svg>
                        </span>
                        <span data-i18n="capture.takePhoto">Take photo</span>
                    </label>
                    <label class="secondary-button capture-gallery">
                        <input type="file" id="galleryInput" accept="image/*" multiple hidden>
                        <span data-i18n="capture.fromGallery">Choose from gallery</span>
                    </label>
                </div>
                <p class="capture-geo" id="capGeoStatus" role="status"></p>
                <div class="capture-thumbs" id="photoThumbs"></div>
            </div>
        </div>

        <div class="card tone-blue">
            <div class="card-header">
                <div>
                    <h3 data-i18n="capture.step2">2 · What changed</h3>
                </div>
            </div>
            <div class="card-body">
                <div class="field">
                    <label for="capDescription" data-i18n="capture.description">Description of the change</label>
                    <textarea id="capDescription" rows="3" data-i18n-placeholder="capture.descriptionPh"></textarea>
                </div>
                <div class="field">
                    <label for="capLocation" data-i18n="capture.location">Location (optional)</label>
                    <input id="capLocation" type="text" data-i18n-placeholder="capture.locationPh">
                </div>
                <div class="capture-grid">
                    <div class="field">
                        <label for="capDate" data-i18n="capture.date">Date issued</label>
                        <input id="capDate" type="date">
                    </div>
                </div>
            </div>
        </div>

        <div class="card tone-teal">
            <div class="card-header">
                <div>
                    <h3 data-i18n="capture.step3">3 · Quick measurement (optional)</h3>
                </div>
            </div>
            <div class="card-body">
                <div class="capture-grid">
                    <div class="field">
                        <label for="capQty" data-i18n="capture.qty">Quantity</label>
                        <input id="capQty" type="number" inputmode="decimal" min="0" step="any">
                    </div>
                    <div class="field">
                        <label for="capUnit" data-i18n="capture.unit">Unit</label>
                        <input id="capUnit" type="text" placeholder="m2">
                    </div>
                    <div class="field">
                        <label for="capRate" data-i18n="capture.rate">Rate claimed (RM, optional)</label>
                        <input id="capRate" type="number" inputmode="decimal" min="0" step="any">
                    </div>
                </div>
            </div>
        </div>

        <div class="capture-actions">
            <ul class="capture-problems" id="captureProblems" hidden></ul>
            <button type="submit" class="primary-button" id="captureSaveBtn" data-i18n="capture.save">Save as draft VO</button>
        </div>
    </form>
</main>

<script src="js/i18n.js?v=20261009h"></script>
<script src="js/calc.js?v=20261009h"></script>
<script src="js/permissions.js?v=20261009h"></script>
<script src="js/store.js?v=20261009h"></script>
<script src="js/config.js?v=20261009h"></script>
<script src="js/cloud.js?v=20261009h"></script>
<script src="js/ui.js?v=20261009h"></script>
<script src="js/notify.js?v=20261009h"></script>
<script src="js/filestore.js?v=20261009h"></script>
<script src="js/sitemap.js?v=20261009h"></script>
<script src="js/askcontract.js?v=20261009h"></script>
<script src="js/capture.js?v=20261009h"></script>
<script src="js/page-capture.js?v=20261009h"></script>

</body>
</html>
