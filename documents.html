<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VO-AI | Documents</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css?v=20261014c">
</head>
<body>

<aside class="sidebar"></aside>

<main class="main">
    <header class="topbar"></header>

    <section class="welcome">
        <div>
            <h2 data-i18n="documents.title">Documents</h2>
        </div>
    </section>

    <div class="card">
        <div class="card-body">
            <div class="doc-summary-bar" id="docSummary"></div>

            <div class="doc-filters">
                <label><span data-i18n="documents.voLabel">Variation order</span>
                    <select id="voFilter"></select>
                </label>
                <label><span data-i18n="documents.kind">Kind</span>
                    <select id="kindFilter">
                        <option value="all" data-i18n="documents.kind.all">All documents</option>
                        <option value="drawings" data-i18n="documents.kind.drawings">Drawings</option>
                        <option value="supporting" data-i18n="documents.kind.supporting">Supporting documents</option>
                        <option value="project" data-i18n="documents.kind.project">Project documents</option>
                    </select>
                </label>
            </div>
        </div>
    </div>

    <div class="card tone-teal" id="projectDocUploadCard" hidden>
        <div class="card-header">
            <div>
                <h3 data-i18n="documents.upload.title">Add a project document</h3>
            </div>
        </div>
        <div class="card-body">
            <div class="doc-upload-row">
                <label class="field">
                    <span data-i18n="documents.upload.category">Category</span>
                    <select id="projectDocCategorySelect">
                        <option value="contract" data-i18n="documents.category.contract">Contract</option>
                        <option value="bq" data-i18n="documents.category.bq">Priced BQ</option>
                        <option value="addendum" data-i18n="documents.category.addendum">Addendum</option>
                        <option value="specification" data-i18n="documents.category.specification">Specification</option>
                        <option value="correspondence" data-i18n="documents.category.correspondence">Correspondence</option>
                        <option value="other" data-i18n="documents.category.other">Other</option>
                    </select>
                </label>
                <label class="field">
                    <span data-i18n="documents.upload.file">File</span>
                    <input type="file" id="projectDocFileInput">
                </label>
            </div>
        </div>
    </div>

    <div class="card tone-purple" id="kbCard" hidden>
        <div class="card-header">
            <div>
                <h3 data-i18n="kb.title">Contract knowledge base (Ask the contract)</h3>
            </div>
        </div>
        <div class="card-body" id="kbBody"></div>
    </div>

    <div id="docGroups" class="doc-scroll" data-fit data-fit-gap="20"></div>

    <div class="disclaimer">
        <strong data-i18n="disclaimer.title">⚠ Professional Review Required</strong>
        <span data-i18n="disclaimer.body">
            AI-generated results are decision-support outputs. Final variation assessment,
            certification and approval must be reviewed by the appropriate construction professional.
        </span>
    </div>
</main>

<script src="js/i18n.js?v=20261014c"></script>
<script src="js/calc.js?v=20261014c"></script>
<script src="js/clauses.js?v=20261014c"></script>
<script src="js/elements.js?v=20261014c"></script>
<script src="js/analysis.js?v=20261014c"></script>
<script src="js/permissions.js?v=20261014c"></script>
<script src="js/deadlines.js?v=20261014c"></script>
<script src="js/store.js?v=20261014c"></script>
<script src="js/config.js?v=20261014c"></script>
<script src="js/cloud.js?v=20261014c"></script>
<script src="js/documents.js?v=20261014c"></script>
<script src="js/bqimport.js?v=20261014c"></script>
<script src="js/contractread.js?v=20261014c"></script>
<script src="js/kbsplit.js?v=20261014c"></script>
<script src="js/contractimport.js?v=20261014c"></script>
<script src="js/ui.js?v=20261014c"></script>
<script src="js/notify.js?v=20261014c"></script>
<script src="js/filestore.js?v=20261014c"></script>
<script src="js/page-documents.js?v=20261014c"></script>

</body>
</html>
